---
- name Enable intranet services
  hosts: servera.lab.example.com
  become: true
  tasks:
    - name: Install httpd and firewalld packages
      ansible.builtin.dnf:
        name:
          - httpd
          - firewalld
        state: present

    - name: Test html page is installed
      ansible.builtin.copy:
        content: "Welcome to the example.com intranet!\n"
        dest: /var/www/html/index.html
        mode: '0644'

    - name: Firewall enabled and running
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started

    - name: Firewall permits access to httpd service
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true

    - name: Web server enabled and running
      ansible.builtin.systemd_service:
        name: httpd
        enabled: true
        state: started

- name: Test intranet web server
  hosts: serverb.lab.example.com
  become: false
  tasks:
    - name: Verify connection to servera from serverb
      ansible.builtin.uri:
        url: http://servera.lab.example.com
        return_content: true
        status_code: 200
      register: results

    - name: Display the results
      ansible.builtin.debug:
        var: results['content']
